name: Test agent-card reader
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet -r requirements.txt
      - run: python -m unittest discover -s tests -v
